<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Lamborghini Real Driving Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050508;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #fff;
        }
        #webgl-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        /* UI Overlay */
        .hud-top {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(15, 15, 20, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 20px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }
        .brand-title {
            font-size: 18px;
            font-weight: 900;
            letter-spacing: 2px;
            color: #ffb703;
            text-transform: uppercase;
        }
        .speedometer {
            font-size: 32px;
            font-weight: 800;
            margin-top: 4px;
            font-variant-numeric: tabular-nums;
        }
        .speedometer span {
            font-size: 14px;
            color: #888;
            font-weight: 500;
        }

        /* Controls Instructions */
        .controls-card {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(15, 15, 20, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 18px;
            border-radius: 12px;
            font-size: 13px;
            color: #aaa;
            line-height: 1.6;
        }
        .key {
            background: #222;
            border: 1px solid #444;
            padding: 2px 6px;
            border-radius: 4px;
            color: #fff;
            font-weight: bold;
        }

        /* Paint Swatches */
        .swatch-bar {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 10;
            display: flex;
            gap: 8px;
            background: rgba(15, 15, 20, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 14px;
            border-radius: 999px;
        }
        .swatch {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.2s, border-color 0.2s;
        }
        .swatch:hover {
            transform: scale(1.15);
        }
        .swatch.active {
            border-color: #fff;
            transform: scale(1.2);
        }
    </style>
</head>
<body>

    <div id="webgl-container"></div>

    <div class="hud-top">
        <div class="brand-title">Lamborghini Revuelto</div>
        <div class="speedometer" id="speedDisplay">0 <span>KM/H</span></div>
    </div>

    <div class="controls-card">
        <div><span class="key">W</span> / <span class="key">↑</span> Accelerate</div>
        <div><span class="key">S</span> / <span class="key">↓</span> Brake / Reverse</div>
        <div><span class="key">A</span> <span class="key">D</span> / <span class="key">←</span> <span class="key">→</span> Turn</div>
        <div><span class="key">SPACE</span> Handbrake</div>
    </div>

    <div class="swatch-bar">
        <div class="swatch active" style="background: #ffb703;" onclick="setCarColor(0xffb703, this)"></div>
        <div class="swatch" style="background: #e63946;" onclick="setCarColor(0xe63946, this)"></div>
        <div class="swatch" style="background: #2a9d8f;" onclick="setCarColor(0x2a9d8f, this)"></div>
        <div class="swatch" style="background: #111115;" onclick="setCarColor(0x111115, this)"></div>
        <div class="swatch" style="background: #f1faee;" onclick="setCarColor(0xf1faee, this)"></div>
    </div>

    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- THREE.JS SETUP ---
        let scene, camera, renderer;
        let carGroup, carBodyMaterial;
        let wheels = [];
        
        // Vehicle Physics / Motion
        let speed = 0;
        let maxSpeed = 1.2;
        let acceleration = 0.015;
        let friction = 0.98;
        let steeringAngle = 0;
        let keys = {};

        const speedDisplay = document.getElementById('speedDisplay');

        function init() {
            const container = document.getElementById('webgl-container');

            // 1. Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a0f);
            scene.fog = new THREE.FogExp2(0x0a0a0f, 0.015);

            // 2. Camera
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);

            // 3. Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // 4. Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
            dirLight.position.set(20, 40, 20);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            scene.add(dirLight);

            // 5. Ground / Grid
            const gridHelper = new THREE.GridHelper(500, 100, 0xffb703, 0x222233);
            gridHelper.position.y = -0.01;
            scene.add(gridHelper);

            const groundGeo = new THREE.PlaneGeometry(500, 500);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x07070a, roughness: 0.8 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // 6. Build Lamborghini
            createLamborghini();

            // Event Listeners
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('keydown', (e) => keys[e.code] = true);
            window.addEventListener('keyup', (e) => keys[e.code] = false);

            animate();
        }

        // --- PROCEDURAL LAMBORGHINI BUILDER ---
        function createLamborghini() {
            carGroup = new THREE.Group();

            // Paint Material (Metallic Supercar Finish)
            carBodyMaterial = new THREE.MeshStandardMaterial({
                color: 0xffb703,
                metalness: 0.8,
                roughness: 0.2
            });

            const carbonMat = new THREE.MeshStandardMaterial({ color: 0x111113, roughness: 0.5 });
            const glassMat = new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 0.1, transparent: true, opacity: 0.8 });
            const ledMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

            // Base Wedge Body (Aggressive Low Lamborghini Shape)
            const mainBodyGeo = new THREE.BoxGeometry(1.8, 0.5, 4.2);
            const mainBody = new THREE.Mesh(mainBodyGeo, carBodyMaterial);
            mainBody.position.y = 0.45;
            mainBody.castShadow = true;
            carGroup.add(mainBody);

            // Roof & Cabin
            const cabinGeo = new THREE.BoxGeometry(1.3, 0.35, 1.8);
            const cabin = new THREE.Mesh(cabinGeo, glassMat);
            cabin.position.set(0, 0.8, -0.2);
            carGroup.add(cabin);

            // Front Hood Slant
            const hoodGeo = new THREE.BoxGeometry(1.7, 0.25, 1.5);
            const hood = new THREE.Mesh(hoodGeo, carBodyMaterial);
            hood.position.set(0, 0.42, 1.3);
            hood.rotation.x = -0.12;
            hood.castShadow = true;
            carGroup.add(hood);

            // Front Splitter / Air Intakes (Carbon Fiber)
            const splitterGeo = new THREE.BoxGeometry(1.85, 0.12, 0.6);
            const splitter = new THREE.Mesh(splitterGeo, carbonMat);
            splitter.position.set(0, 0.15, 2.0);
            carGroup.add(splitter);

            // Y-Shaped Headlights (Lamborghini Signature)
            const hlGeo = new THREE.BoxGeometry(0.4, 0.05, 0.1);
            const hlLeft = new THREE.Mesh(hlGeo, ledMat);
            hlLeft.position.set(0.6, 0.45, 2.08);
            hlLeft.rotation.y = -0.2;
            carGroup.add(hlLeft);

            const hlRight = new THREE.Mesh(hlGeo, ledMat);
            hlRight.position.set(-0.6, 0.45, 2.08);
            hlRight.rotation.y = 0.2;
            carGroup.add(hlRight);

            // Wheels Assembly
            const wheelGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.25, 24);
            const wheelMat = new THREE.MeshStandardMaterial({ color: 0x151515, roughness: 0.3 });
            wheelGeo.rotateZ(Math.PI / 2);

            const wheelPos = [
                { x: 0.9, y: 0.35, z: 1.2 },  // Front Right
                { x: -0.9, y: 0.35, z: 1.2 }, // Front Left
                { x: 0.9, y: 0.35, z: -1.2 }, // Rear Right
                { x: -0.9, y: 0.35, z: -1.2 } // Rear Left
            ];

            wheels = [];
            wheelPos.forEach(pos => {
                const wheel = new THREE.Mesh(wheelGeo, wheelMat);
                wheel.position.set(pos.x, pos.y, pos.z);
                wheel.castShadow = true;
                carGroup.add(wheel);
                wheels.push(wheel);
            });

            scene.add(carGroup);
        }

        // --- COLOR CUSTOMIZER ---
        function setCarColor(hexColor, element) {
            carBodyMaterial.color.setHex(hexColor);
            document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
            element.classList.add('active');
        }

        // --- PHYSICS & ANIMATION ---
        function updatePhysics() {
            // Forward / Reverse
            if (keys['KeyW'] || keys['ArrowUp']) {
                if (speed < maxSpeed) speed += acceleration;
            } else if (keys['KeyS'] || keys['ArrowDown']) {
                if (speed > -maxSpeed * 0.5) speed -= acceleration;
            } else {
                speed *= friction;
            }

            // Handbrake
            if (keys['Space']) {
                speed *= 0.85;
            }

            // Steering
            if (keys['KeyA'] || keys['ArrowLeft']) {
                steeringAngle = 0.035;
            } else if (keys['KeyD'] || keys['ArrowRight']) {
                steeringAngle = -0.035;
            } else {
                steeringAngle = 0;
            }

            // Apply Motion
            if (Math.abs(speed) > 0.001) {
                carGroup.rotation.y += steeringAngle * (speed > 0 ? 1 : -1);
                carGroup.translateZ(speed);

                // Rotate Wheels
                wheels.forEach(w => w.rotation.x += speed * 2);
            }

            // Update Speedometer UI
            const kmh = Math.round(Math.abs(speed) * 220);
            speedDisplay.innerHTML = `${kmh} <span>KM/H</span>`;

            // Dynamic Camera Tracking (Chase Cam)
            const relativeCameraOffset = new THREE.Vector3(0, 2.5, -6);
            const cameraOffset = relativeCameraOffset.applyMatrix4(carGroup.matrixWorld);
            
            camera.position.lerp(cameraOffset, 0.1);
            camera.lookAt(carGroup.position.clone().add(new THREE.Vector3(0, 0.8, 0)));
        }

        function animate() {
            requestAnimationFrame(animate);
            updatePhysics();
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.onload = init;
    </script>
</body>
</html>
