<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photorealistic Lamborghini Huracán STO Showcase</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050508;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #fff;
        }
        #webgl-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        /* Top HUD */
        .hud-top {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(12, 12, 18, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 14px 22px;
            border-radius: 18px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.6);
        }
        .brand-title {
            font-size: 16px;
            font-weight: 900;
            letter-spacing: 2px;
            color: #ff6b00;
            text-transform: uppercase;
        }
        .speedometer {
            font-size: 34px;
            font-weight: 800;
            margin-top: 2px;
            font-variant-numeric: tabular-nums;
        }
        .speedometer span {
            font-size: 14px;
            color: #888;
            font-weight: 500;
        }

        /* Mode Toggle Button */
        .mode-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10;
            background: rgba(12, 12, 18, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 10px 20px;
            border-radius: 999px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        .mode-toggle:hover {
            background: #ff6b00;
            color: #000;
            border-color: #ff6b00;
            transform: translateY(-2px);
        }

        /* Color Swatches */
        .swatch-bar {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 10;
            display: flex;
            gap: 10px;
            background: rgba(12, 12, 18, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 10px 16px;
            border-radius: 999px;
        }
        .swatch {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.2s, border-color 0.2s;
        }
        .swatch:hover {
            transform: scale(1.15);
        }
        .swatch.active {
            border-color: #fff;
            transform: scale(1.25);
            box-shadow: 0 0 12px rgba(255,255,255,0.4);
        }

        /* Controls Help Card */
        .controls-card {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(12, 12, 18, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 12px 18px;
            border-radius: 14px;
            font-size: 12px;
            color: #aaa;
            line-height: 1.7;
        }
        .key {
            background: #222;
            border: 1px solid #444;
            padding: 2px 6px;
            border-radius: 4px;
            color: #fff;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="webgl-container"></div>

    <div class="hud-top">
        <div class="brand-title">Huracán STO Widebody</div>
        <div class="speedometer" id="speedDisplay">0 <span>KM/H</span></div>
    </div>

    <button class="mode-toggle" id="modeBtn" onclick="toggleDriveMode()">Switch to Drive Mode</button>

    <div class="controls-card" id="controlsCard" style="display:none;">
        <div><span class="key">W</span> / <span class="key">↑</span> Accelerate</div>
        <div><span class="key">S</span> / <span class="key">↓</span> Brake / Reverse</div>
        <div><span class="key">A</span> <span class="key">D</span> / <span class="key">←</span> <span class="key">→</span> Steer</div>
        <div><span class="key">SHIFT</span> Nitro Boost</div>
        <div><span class="key">SPACE</span> Handbrake</div>
    </div>

    <div class="swatch-bar">
        <div class="swatch active" style="background: #ff6b00;" onclick="setCarColor(0xff6b00, this)"></div>
        <div class="swatch" style="background: #e63946;" onclick="setCarColor(0xe63946, this)"></div>
        <div class="swatch" style="background: #22c55e;" onclick="setCarColor(0x22c55e, this)"></div>
        <div class="swatch" style="background: #3b82f6;" onclick="setCarColor(0x3b82f6, this)"></div>
        <div class="swatch" style="background: #111115;" onclick="setCarColor(0x111115, this)"></div>
        <div class="swatch" style="background: #ffffff;" onclick="setCarColor(0xffffff, this)"></div>
    </div>

    <!-- Three.js + OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // --- THREE.JS SETUP ---
        let scene, camera, renderer, controls;
        let carGroup, carBodyMaterial, carbonMaterial, wheelMeshGroup = [];
        let nitroFlames = [];

        // Game State
        let isDriveMode = false;
        let speed = 0;
        let maxSpeed = 1.6;
        let acceleration = 0.02;
        let friction = 0.98;
        let steeringAngle = 0;
        let keys = {};

        const speedDisplay = document.getElementById('speedDisplay');
        const modeBtn = document.getElementById('modeBtn');
        const controlsCard = document.getElementById('controlsCard');

        function init() {
            const container = document.getElementById('webgl-container');

            // 1. Scene & Atmosphere
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a0f);
            scene.fog = new THREE.FogExp2(0x0a0a0f, 0.012);

            // 2. Camera
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(4.5, 1.6, 5.5);

            // 3. Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.25;
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // 4. Orbit Controls (Showroom Mode)
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 - 0.01;
            controls.minDistance = 2.5;
            controls.maxDistance = 15;

            // 5. Lighting Setup
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xffffff, 2.5);
            sunLight.position.set(10, 20, 15);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            scene.add(sunLight);

            const rimLight = new THREE.DirectionalLight(0xffaa00, 1.8);
            rimLight.position.set(-10, 10, -10);
            scene.add(rimLight);

            // 6. Reflective Studio Floor / Wet Asphalt Grid
            const floorGeo = new THREE.PlaneGeometry(500, 500);
            const floorMat = new THREE.MeshStandardMaterial({
                color: 0x0a0a0e,
                roughness: 0.15,
                metalness: 0.85
            });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            const gridHelper = new THREE.GridHelper(500, 100, 0xff6b00, 0x1f1f2e);
            gridHelper.position.y = 0.005;
            scene.add(gridHelper);

            // 7. Build Procedural Lamborghini Huracán STO Model
            buildLamborghini();

            // Event Listeners
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('keydown', (e) => keys[e.code] = true);
            window.addEventListener('keyup', (e) => keys[e.code] = false);

            animate();
        }

        // --- HIGH-DETAIL HURACÁN STO BUILDER ---
        function buildLamborghini() {
            carGroup = new THREE.Group();

            // Physical Clearcoat Paint Shader
            carBodyMaterial = new THREE.MeshPhysicalMaterial({
                color: 0xff6b00,
                metalness: 0.7,
                roughness: 0.2,
                clearcoat: 1.0,
                clearcoatRoughness: 0.05,
                reflectivity: 1.0
            });

            carbonMaterial = new THREE.MeshStandardMaterial({
                color: 0x111115,
                roughness: 0.4,
                metalness: 0.8
            });

            const glassMat = new THREE.MeshPhysicalMaterial({
                color: 0x050508,
                metalness: 0.9,
                roughness: 0.1,
                transmission: 0.6,
                transparent: true,
                opacity: 0.85
            });

            const ledMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const brakeDiscMat = new THREE.MeshStandardMaterial({ color: 0x777777, metalness: 0.9, roughness: 0.2 });
            const caliperMat = new THREE.MeshStandardMaterial({ color: 0xff6b00, metalness: 0.5, roughness: 0.3 });

            // 1. Lower Wedge Chassis & Floorpan
            const baseChassis = new THREE.Mesh(new THREE.BoxGeometry(1.95, 0.35, 4.3), carbonMaterial);
            baseChassis.position.y = 0.25;
            baseChassis.castShadow = true;
            carGroup.add(baseChassis);

            // 2. Main Body Shell (Low Supercar Wedge)
            const mainBody = new THREE.Mesh(new THREE.BoxGeometry(1.85, 0.45, 4.1), carBodyMaterial);
            mainBody.position.y = 0.48;
            mainBody.castShadow = true;
            carGroup.add(mainBody);

            // 3. Widebody Fender Flares (Liberty Walk Style)
            const fenderGeo = new THREE.BoxGeometry(0.2, 0.42, 1.2);
            const fenderFL = new THREE.Mesh(fenderGeo, carBodyMaterial); fenderFL.position.set(0.98, 0.48, 1.1);
            const fenderFR = new THREE.Mesh(fenderGeo, carBodyMaterial); fenderFR.position.set(-0.98, 0.48, 1.1);
            const fenderRL = new THREE.Mesh(fenderGeo, carBodyMaterial); fenderRL.position.set(1.02, 0.5, -1.1);
            const fenderRR = new THREE.Mesh(fenderGeo, carBodyMaterial); fenderRR.position.set(-1.02, 0.5, -1.1);
            [fenderFL, fenderFR, fenderRL, fenderRR].forEach(f => { f.castShadow = true; carGroup.add(f); });

            // 4. Huracán Slanted Cabin & Canopy
            const cabinGeo = new THREE.BoxGeometry(1.35, 0.38, 1.8);
            const cabin = new THREE.Mesh(cabinGeo, glassMat);
            cabin.position.set(0, 0.85, -0.2);
            carGroup.add(cabin);

            // Hood Slant
            const hoodGeo = new THREE.BoxGeometry(1.7, 0.18, 1.4);
            const hood = new THREE.Mesh(hoodGeo, carBodyMaterial);
            hood.position.set(0, 0.48, 1.35);
            hood.rotation.x = -0.14;
            hood.castShadow = true;
            carGroup.add(hood);

            // Hood STO Air Ducts
            const ductGeo = new THREE.BoxGeometry(0.4, 0.05, 0.5);
            const ductL = new THREE.Mesh(ductGeo, carbonMaterial); ductL.position.set(0.35, 0.58, 1.3); ductL.rotation.x = -0.14;
            const ductR = new THREE.Mesh(ductGeo, carbonMaterial); ductR.position.set(-0.35, 0.58, 1.3); ductR.rotation.x = -0.14;
            carGroup.add(ductL, ductR);

            // STO Hood Stripes (Decal)
            const stripeGeo = new THREE.BoxGeometry(0.12, 0.02, 1.2);
            const stripeL = new THREE.Mesh(stripeGeo, carbonMaterial); stripeL.position.set(0.18, 0.58, 1.3); stripeL.rotation.x = -0.14;
            const stripeR = new THREE.Mesh(stripeGeo, carbonMaterial); stripeR.position.set(-0.18, 0.58, 1.3); stripeR.rotation.x = -0.14;
            carGroup.add(stripeL, stripeR);

            // 5. Front Aggressive Splitter & Intakes
            const splitter = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.1, 0.6), carbonMaterial);
            splitter.position.set(0, 0.15, 2.05);
            carGroup.add(splitter);

            // 6. Y-Shaped Matrix LED Headlights
            const hlGeo = new THREE.BoxGeometry(0.4, 0.04, 0.08);
            const hlL = new THREE.Mesh(hlGeo, ledMat); hlL.position.set(0.65, 0.52, 2.04); hlL.rotation.y = -0.25;
            const hlR = new THREE.Mesh(hlGeo, ledMat); hlR.position.set(-0.65, 0.52, 2.04); hlR.rotation.y = 0.25;
            carGroup.add(hlL, hlR);

            // 7. Large SVJ / STO Rear Wing
            const wingBlade = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.05, 0.4), carbonMaterial);
            wingBlade.position.set(0, 1.15, -2.0);
            wingBlade.rotation.x = 0.08;

            const wingPillarL = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.35, 0.15), carbonMaterial); wingPillarL.position.set(0.5, 0.98, -1.95);
            const wingPillarR = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.35, 0.15), carbonMaterial); wingPillarR.position.set(-0.5, 0.98, -1.95);
            carGroup.add(wingBlade, wingPillarL, wingPillarR);

            // 8. High-Exit Dual Exhausts
            const exhaustGeo = new THREE.CylinderGeometry(0.07, 0.07, 0.2, 16);
            exhaustGeo.rotateX(Math.PI / 2);
            const exhaustMat = new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.9, roughness: 0.2 });
            
            const exL = new THREE.Mesh(exhaustGeo, exhaustMat); exL.position.set(0.25, 0.55, -2.12);
            const exR = new THREE.Mesh(exhaustGeo, exhaustMat); exR.position.set(-0.25, 0.55, -2.12);
            carGroup.add(exL, exR);

            // Exhaust Nitro Flame Effects
            const flameGeo = new THREE.ConeGeometry(0.08, 0.5, 12);
            flameGeo.rotateX(-Math.PI / 2);
            const flameMat = new THREE.MeshBasicMaterial({ color: 0x00d2ff, transparent: true, opacity: 0 });
            
            const flameL = new THREE.Mesh(flameGeo, flameMat); flameL.position.set(0.25, 0.55, -2.45);
            const flameR = new THREE.Mesh(flameGeo, flameMat); flameR.position.set(-0.25, 0.55, -2.45);
            carGroup.add(flameL, flameR);
            nitroFlames = [flameL, flameR];

            // 9. Custom Forged Rims & Brake Rotors
            const wheelPositions = [
                { x: 0.95, y: 0.36, z: 1.2 },  // Front Right
                { x: -0.95, y: 0.36, z: 1.2 }, // Front Left
                { x: 0.98, y: 0.38, z: -1.2 }, // Rear Right
                { x: -0.98, y: 0.38, z: -1.2 } // Rear Left
            ];

            wheelMeshGroup = [];
            wheelPositions.forEach(pos => {
                const wGroup = new THREE.Group();

                // Rubber Tire
                const tireGeo = new THREE.CylinderGeometry(0.36, 0.36, 0.28, 32);
                tireGeo.rotateZ(Math.PI / 2);
                const tireMat = new THREE.MeshStandardMaterial({ color: 0x111113, roughness: 0.8 });
                const tire = new THREE.Mesh(tireGeo, tireMat);
                tire.castShadow = true;
                wGroup.add(tire);

                // Brake Rotor Disc
                const discGeo = new THREE.CylinderGeometry(0.26, 0.26, 0.05, 24);
                discGeo.rotateZ(Math.PI / 2);
                const disc = new THREE.Mesh(discGeo, brakeDiscMat);
                wGroup.add(disc);

                // Brake Caliper
                const caliperGeo = new THREE.BoxGeometry(0.08, 0.15, 0.12);
                const caliper = new THREE.Mesh(caliperGeo, caliperMat);
                caliper.position.set(0, 0.15, 0);
                wGroup.add(caliper);

                // 10-Spoke Forged Alloy Rim
                const rimMat = new THREE.MeshStandardMaterial({ color: 0x151518, metalness: 0.9, roughness: 0.2 });
                for (let i = 0; i < 10; i++) {
                    const spokeGeo = new THREE.BoxGeometry(0.04, 0.32, 0.02);
                    const spoke = new THREE.Mesh(spokeGeo, rimMat);
                    spoke.rotation.x = (i * Math.PI) / 5;
                    spoke.position.x = pos.x > 0 ? 0.08 : -0.08;
                    wGroup.add(spoke);
                }

                wGroup.position.set(pos.x, pos.y, pos.z);
                carGroup.add(wGroup);
                wheelMeshGroup.push(wGroup);
            });

            scene.add(carGroup);
        }

        // --- MODE TOGGLE & COLOR CUSTOMIZER ---
        function toggleDriveMode() {
            isDriveMode = !isDriveMode;
            if (isDriveMode) {
                controls.enabled = false;
                modeBtn.innerText = "Switch to Showroom";
                controlsCard.style.display = "block";
            } else {
                controls.enabled = true;
                modeBtn.innerText = "Switch to Drive Mode";
                controlsCard.style.display = "none";
                speed = 0;
            }
        }

        function setCarColor(hexColor, element) {
            carBodyMaterial.color.setHex(hexColor);
            document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
            element.classList.add('active');
        }

        // --- PHYSICS & ANIMATION ---
        function updateDrivingPhysics() {
            if (!isDriveMode) return;

            const isNitro = keys['ShiftLeft'] || keys['ShiftRight'];
            const currentMaxSpeed = isNitro ? maxSpeed * 1.5 : maxSpeed;

            // Nitro Flame Effects
            nitroFlames.forEach(f => f.material.opacity = (isNitro && speed > 0.5) ? 0.9 : 0);

            // Forward / Reverse
            if (keys['KeyW'] || keys['ArrowUp']) {
                if (speed < currentMaxSpeed) speed += acceleration * (isNitro ? 2.0 : 1.0);
            } else if (keys['KeyS'] || keys['ArrowDown']) {
                if (speed > -maxSpeed * 0.4) speed -= acceleration;
            } else {
                speed *= friction;
            }

            // Handbrake
            if (keys['Space']) {
                speed *= 0.82;
            }

            // Steering
            if (keys['KeyA'] || keys['ArrowLeft']) {
                steeringAngle = 0.032;
            } else if (keys['KeyD'] || keys['ArrowRight']) {
                steeringAngle = -0.032;
            } else {
                steeringAngle = 0;
            }

            // Motion Translation
            if (Math.abs(speed) > 0.001) {
                carGroup.rotation.y += steeringAngle * (speed > 0 ? 1 : -1);
                carGroup.translateZ(speed);

                // Rotate Wheels
                wheelMeshGroup.forEach(w => w.children.forEach(c => c.rotation.x += speed * 1.5));
            }

            // Update Speedometer UI
            const kmh = Math.round(Math.abs(speed) * 210);
            speedDisplay.innerHTML = `${kmh} <span>KM/H</span>`;

            // Dynamic Chase Camera Tracking
            const relativeCamOffset = new THREE.Vector3(0, 2.2, -5.5);
            const camOffset = relativeCamOffset.applyMatrix4(carGroup.matrixWorld);

            camera.position.lerp(camOffset, 0.12);
            camera.lookAt(carGroup.position.clone().add(new THREE.Vector3(0, 0.7, 0)));
        }

        function animate() {
            requestAnimationFrame(animate);

            if (isDriveMode) {
                updateDrivingPhysics();
            } else {
                controls.update();
                // Gentle turntable rotation in showroom
                carGroup.rotation.y += 0.003;
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.onload = init;
    </script>
</body>
</html>
